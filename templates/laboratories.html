{% extends 'base.html' %}

{% block title %}
Laboratories
{% endblock %}

{% block content %}

<h1 class="mb-4">Laboratory List</h1>

<div class="mb-3">
    <a href="/create-laboratory" class="btn btn-primary">
        Add Laboratory
    </a>
</div>

<table class="table table-bordered table-striped">

    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Lab Name</th>
            <th>Location</th>
            <th>Capacity</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

    {% for lab in laboratories %}

        <tr>
            <td>{{ lab.id }}</td>
            <td>{{ lab.lab_name }}</td>
            <td>{{ lab.location }}</td>
            <td>{{ lab.capacity }}</td>

            <td>
                <a
                    href="/edit-laboratory/{{ lab.id }}"
                    class="btn btn-warning btn-sm">
                    Edit
                </a>

                <form action="{{ url_for('delete_laboratory', id=lab.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this laboratory?');">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </form>
            </td>
        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
