{% extends 'base.html' %}

{% block title %}
Add Material
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/" class="text-decoration-none">Home</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('materials') }}" class="text-decoration-none">Lab Materials</a></li>
                <li class="breadcrumb-item active" aria-current="page">Add Material</li>
            </ol>
        </nav>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white p-3">
                <h3 class="card-title mb-0 fs-5">
                    <i class="bi bi-box-seam me-2"></i>Register New Lab Material
                </h3>
            </div>
            <div class="card-body p-4">
                <form action="" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label for="material_name" class="form-label fw-semibold">Material / Item Name</label>
                        <input type="text" id="material_name" name="material_name" class="form-control" 
                               placeholder="e.g., Computer, Projector, RJ45 Cable" required>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label fw-semibold">Item Category</label>
                        <select id="category" name="category" class="form-select" required>
                            <option value="" disabled selected>Select a category...</option>
                            <option value="Equipment">Equipment / Hardware</option>
                            <option value="Computer">Computer / Positivo</option>
                            <option value="Computer">Computer / Lenovo</option>
                            <option value="Other">Other Supplies</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="quantity" class="form-label fw-semibold">Initial Quantity</label>
                            <input type="number" id="quantity" name="quantity" class="form-control" 
                                   min="1" value="1" required>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label fw-semibold">Current Status</label>
                            <select id="status" name="status" class="form-select" required>
                                <option value="Available" selected>Available</option>
                                <option value="Low Stock">Low Stock</option>
                                <option value="Out of Order">Out of Order</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="laboratory_id" class="form-label fw-semibold">Assign to Location / Lab</label>
                        <select id="laboratory_id" name="laboratory_id" class="form-select" required>
                            <option value="" disabled selected>Choose target laboratory...</option>
                            {% for lab in labs %}
                                <option value="{{ lab.id }}">
                                    {{ lab.lab_name }} — {{ lab.location }} (Cap: {{ lab.capacity }})
                                </option>
                            {% endfor %}
                        </select>
                        <div class="form-text text-muted">
                            Items must be anchored to an existing laboratory profile.
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('materials') }}" class="btn btn-light border">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Save Material
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
