<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Lab Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center" style="margin-top: 10%;">
        <div class="card p-4 shadow" style="width: 400px;">
            <h3 class="text-center mb-1">Reset Password</h3>
            <p class="text-center text-muted small mb-4">Enter your username and we'll give you a reset link.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                <div class="text-center mt-3">
                    <a href="{{ url_for('login') }}" class="text-muted small">Back to login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
