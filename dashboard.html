{% extends 'base.html' %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}
<h1 class="mb-4">Lab Management Dashboard</h1>
<div class="row">
    <div class="col-md-6">
        <div class="card text-center shadow">
            <div class="card-body">
                <h2>{{ student_count }}</h2>
                <p>Total Students</p>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card text-center shadow">
            <div class="card-body">
                <h2>{{ laboratory_count }}</h2>
                <p>Total Laboratories</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
